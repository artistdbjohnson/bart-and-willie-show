name: Episode-day refresh
# Vercel Hobby allows only daily crons, so episode days (Mon + Fri) poll from here.
# Every 30 min, ~6am–midnight ET (UTC: 10:00–23:30 Mon/Fri, 00:00–04:30 Tue/Sat).
on:
  schedule:
    - cron: "*/30 10-23 * * 1,5"
    - cron: "*/30 0-4 * * 2,6"
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call protected cron route
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" https://bart-and-willie-show.vercel.app/api/cron/daily
